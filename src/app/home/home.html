<h2>Kurslista över program för Webbutveckling hos MIUN</h2>
<main id="indexMain">
  @if(error()) {
  <div class="error">
    <p>
      {{ error() }}
    </p>
  </div>
  }
  <article id="courseList">
    <div id="searchBar">
      <label for="search">Sök kurs</label>
      <input type="text" id="search" name="search">
    </div>

    <div id="courseHeaders" (click)="findID($event)">
      <p id="code">Kurskod</p>
      <p id="name">Kursnamn</p>
      <p id="progression">Progression</p>
      <p>Kursplan</p>
    </div>
    @for(course of courses(); track course.code) {
    <section id="course">
      <p>
        {{ course.code.toUpperCase() }}
      </p>
      <p>
        {{ course.coursename }}
      </p>
      <p>
        {{ course.progression }}
      </p>
      <p> 
        <a [href]="course.syllabus">
          {{ course.code.toUpperCase() }} </a>
      </p>
    </section>
    }
  </article>
</main>
